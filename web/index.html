<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Suelta lo que te estresa y mantén estable tu estrella.">
  <meta name="theme-color" content="#04050D">

  <!-- Se abre como app desde la pantalla de inicio del iPhone -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mi Estrella">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>Mi Estrella</title>
  <style>
    html, body { margin: 0; height: 100%; background: #04050D; overscroll-behavior: none; }
    #cargando { position: fixed; inset: 0; display: grid; place-items: center; }
    #cargando div {
      width: 72px; height: 72px; border-radius: 50%;
      background: radial-gradient(circle, #fff6dc 0%, #ffd58a 40%, #ff9a3c 70%, transparent 72%);
      box-shadow: 0 0 60px 18px rgba(255, 190, 110, .35);
      animation: latido 1.6s ease-in-out infinite;
    }
    @keyframes latido { 50% { transform: scale(1.08); opacity: .85; } }
  </style>
</head>
<body>
  <div id="cargando"><div></div></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('cargando');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
