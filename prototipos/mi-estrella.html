<title>Mi Estrella</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Estrella">
<meta name="theme-color" content="#04050D">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-column phone app floating over a live star field. Glass header holding the star, frosted glass cards, floating glass tab bar. Dark-only by design: the page is a night sky; --star retints the UI with the star's current state. */
:root{
  --bg:#04050D; --text:#EEF0FF; --muted:#A3A8CC; --faint:#6F75A0; --ink:#0A0B18;
  --glass:rgba(255,255,255,.06); --glass-2:rgba(255,255,255,.10); --glass-3:rgba(255,255,255,.17);
  --line:rgba(255,255,255,.12); --line-2:rgba(255,255,255,.24);
  --star:#FFD58A; --ok:#7CF0B5; --warn:#FFC86B; --hot:#FF7A6B; --violet:#B79CFF; --sky:#7CC8FF;
  --r-lg:24px; --r-md:16px; --r-sm:12px;
  --blur:saturate(170%) blur(22px);
  --lift:inset 0 1px 0 rgba(255,255,255,.14), 0 12px 32px rgba(0,0,0,.35);
  --display:'Sora',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{
  background:var(--bg); color:var(--text); font-family:var(--display); font-size:16px; line-height:1.4; -webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(130px + env(safe-area-inset-bottom,0px));
  min-height:100%; overscroll-behavior-y:none;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:rgba(4,5,13,.7);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;pointer-events:none}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--star);outline-offset:3px}
#app{max-width:560px;margin:0 auto;position:relative;z-index:1}

.glass,.task,.panel,.empty,.hope,.ladder,.cat-row,.scope,.top,.big div{
  background:var(--glass); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--lift);
  backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
}

/* buttons */
.btn{border:1px solid var(--line-2);background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.07));color:var(--text);padding:12px 20px;font-weight:600;font-size:16px;border-radius:999px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s cubic-bezier(.3,1.6,.5,1),box-shadow .2s,background .2s}
.btn:active,.chip:active,.check:active,.play:active,.fab:active,.pick button:active,.swatch:active,.tab:active{transform:scale(.94)}
.btn.primary{background:linear-gradient(135deg,var(--star),#fff 170%);color:var(--ink);border-color:transparent;box-shadow:0 0 28px color-mix(in srgb,var(--star) 45%,transparent),inset 0 1px 0 rgba(255,255,255,.6)}
.btn.ghost{background:var(--glass-2)}
.btn.danger{background:rgba(255,122,107,.14);border-color:rgba(255,122,107,.45);color:#FFB3A8}
.btn.go{background:rgba(124,240,181,.16);border-color:rgba(124,240,181,.5);color:var(--ok)}
.btn.sky{background:rgba(124,200,255,.15);border-color:rgba(124,200,255,.5);color:#BFE3FF}
.btn.small{padding:8px 14px;font-size:14px}

/* header */
.top{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:5;margin-top:8px;padding:10px 14px 10px 8px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:rgba(14,16,36,.55)}
.mini{width:72px;height:72px;border:0;background:none;padding:0;display:block;position:relative;border-radius:50%}
.mini canvas{width:100%;height:100%;display:block}
.hud{display:flex;flex-direction:column;gap:7px;min-width:0}
.hud-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.state{font-weight:600;font-size:21px;line-height:1;letter-spacing:-.01em;color:var(--star);text-shadow:0 0 18px color-mix(in srgb,var(--star) 55%,transparent);transition:color .6s}
.pct{font:500 17px/1 var(--mono);font-variant-numeric:tabular-nums;color:var(--text)}
.meter{height:8px;border-radius:99px;background:rgba(255,255,255,.09);position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:99px;transition:width .8s cubic-bezier(.3,1.3,.5,1);max-width:100%;box-shadow:0 0 14px var(--star)}
.hud small{font-size:12px;line-height:1.3;color:var(--muted)}
.bump{animation:bump .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{35%{transform:scale(1.22)}}
.sync{font:500 11px/1 var(--mono);color:var(--faint);text-align:right;padding-block:8px;min-height:27px}

.view{display:flex;flex-direction:column;gap:14px;animation:viewIn .4s cubic-bezier(.3,1.2,.5,1)}
@keyframes viewIn{from{transform:translateY(10px);opacity:0}}
h2{font-size:28px;font-weight:600;letter-spacing:-.02em;margin:6px 0 0;text-wrap:balance;line-height:1.1}
.lbl{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{background:var(--glass-2);border:1px solid var(--line);padding:8px 14px;font-weight:500;font-size:14px;white-space:nowrap;border-radius:999px;display:inline-flex;gap:7px;align-items:center;transition:transform .15s cubic-bezier(.3,1.6,.5,1),background .2s}
.chip.on{background:rgba(255,255,255,.92);color:var(--ink);border-color:transparent;box-shadow:0 0 18px rgba(255,255,255,.18)}
.chip .n{font-family:var(--mono);font-size:12px;opacity:.7}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c,#fff);flex:none;box-shadow:0 0 8px var(--c,#fff)}

/* hope + warn */
.hope{background:linear-gradient(135deg,rgba(183,156,255,.18),rgba(124,200,255,.10));border-color:rgba(183,156,255,.35);padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.hope b{font-weight:600;font-size:16px}
.hope p{margin:0;font-size:14px;color:var(--muted);grid-column:1}
.seeds{display:flex;gap:8px;grid-row:1/3;grid-column:2}
.seeds i{width:16px;height:16px;border-radius:50%;border:1px solid var(--line-2)}
.seeds i.on{background:radial-gradient(circle at 40% 40%,#fff,#9fd8ff 45%,#7b6bff);border-color:transparent;box-shadow:0 0 14px #9fd8ff;animation:seed 2.4s ease-in-out infinite}
@keyframes seed{50%{box-shadow:0 0 22px #b9e4ff}}
.warn{background:rgba(255,122,107,.12);border:1px solid rgba(255,122,107,.4);border-radius:var(--r-md);padding:12px 16px;font-weight:500;color:#FFC9C1;animation:warnGlow 2.4s ease-in-out infinite}
@keyframes warnGlow{50%{box-shadow:0 0 28px rgba(255,122,107,.3)}}

/* task card */
.list{display:flex;flex-direction:column;gap:12px}
.task{position:relative;overflow:hidden;padding:0;animation:rise .5s cubic-bezier(.3,1.3,.5,1) both}
@keyframes rise{from{transform:translateY(14px) scale(.98);opacity:0}}
.swipe-bg{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-weight:600;font-size:14px;opacity:0;transition:opacity .15s}
.task.sw-r .swipe-bg{opacity:1;background:linear-gradient(90deg,rgba(124,240,181,.35),transparent 70%);color:var(--ok)}
.task.sw-l .swipe-bg{opacity:1;background:linear-gradient(270deg,rgba(255,122,107,.35),transparent 70%);color:var(--hot)}
.task.sw-l .swipe-bg span:first-child,.task.sw-r .swipe-bg span:last-child{opacity:0}
.row{position:relative;z-index:1;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px 14px 14px 18px;touch-action:pan-y;will-change:transform;border-radius:var(--r-lg)}
.task.sw-r .row,.task.sw-l .row{background:rgba(14,16,36,.92)}
.row::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:3px;border-radius:0 3px 3px 0;background:var(--c,rgba(255,255,255,.3));box-shadow:0 0 12px var(--c,transparent)}
.row.snap{transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
.check{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line-2);background:rgba(255,255,255,.04);display:grid;place-items:center;padding:0;transition:transform .15s cubic-bezier(.3,1.6,.5,1),background .2s,border-color .2s}
.check svg{width:24px;height:24px;stroke:var(--ink);stroke-width:3.5;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40}
.t-body{min-width:0;background:none;border:0;text-align:left;padding:0}
.t-title{font-weight:500;font-size:17px;line-height:1.3;overflow-wrap:anywhere}
.t-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;align-items:center}
.tag{font-size:12px;font-weight:500;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--c,#fff) 18%,transparent);border:1px solid color-mix(in srgb,var(--c,#fff) 45%,transparent);color:#fff}
.sz{font:500 11px/1 var(--mono);background:var(--glass-2);padding:5px 8px;border-radius:99px;color:var(--muted)}
.mt{font:500 11px/1 var(--mono);padding:4px 8px;border:1px solid var(--line);border-radius:99px;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted)}
.mt.live{color:#CFEBFF;border-color:rgba(124,200,255,.55);background:rgba(124,200,255,.14);animation:live 1.6s ease-in-out infinite}
@keyframes live{50%{box-shadow:0 0 12px rgba(124,200,255,.5)}}
.mt.late{color:#FFC9C1;border-color:rgba(255,122,107,.55);background:rgba(255,122,107,.14)}
.mt.soon{color:#FFE3B0;border-color:rgba(255,200,107,.5);background:rgba(255,200,107,.12)}
.play{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--glass-2);display:grid;place-items:center;padding:0;transition:transform .15s cubic-bezier(.3,1.6,.5,1)}
.play.pause{background:rgba(255,200,107,.16);border-color:rgba(255,200,107,.5)}
.play svg{width:14px;height:14px;fill:var(--text)}
.task.completing{pointer-events:none;animation:vanish .7s cubic-bezier(.5,0,.7,.4) .25s forwards}
.task.completing .check{background:var(--ok);border-color:var(--ok);box-shadow:0 0 22px var(--ok)}
.task.completing .check svg{animation:draw .25s ease-out forwards}
.task.completing .t-title{opacity:.5;text-decoration:line-through}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes vanish{30%{transform:scale(1.02);box-shadow:0 0 40px rgba(124,240,181,.35)}100%{transform:translateY(-30px) scale(.9);opacity:0;filter:blur(8px)}}

/* detail */
.detail{position:relative;z-index:1;border-top:1px solid var(--line);padding:14px 16px 16px;display:flex;flex-direction:column;gap:14px;animation:unfold .3s ease-out}
@keyframes unfold{from{opacity:0;transform:translateY(-6px)}}
.kv,.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv div,.quick div{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;background:rgba(255,255,255,.04);min-width:0}
.kv b,.quick b{display:block;font:500 16px/1.2 var(--mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere;margin-top:3px}
.kv small,.quick small{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.subs{display:flex;flex-direction:column;gap:8px}
.sub{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.sub button.box{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-2);background:transparent;padding:0;display:grid;place-items:center;transition:background .2s}
.sub button.box svg{width:15px;height:15px;stroke:var(--ink);stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.sub.done button.box{background:var(--ok);border-color:var(--ok);box-shadow:0 0 12px var(--ok);animation:pop .35s cubic-bezier(.3,1.8,.5,1)}
.sub.done button.box svg{opacity:1}
.sub.done span{text-decoration:line-through;color:var(--faint)}
.sub span{overflow-wrap:anywhere;min-width:0}
@keyframes pop{40%{transform:scale(1.25)}}
.x-btn{background:var(--glass-2);border:1px solid var(--line);border-radius:50%;width:32px;height:32px;font-size:18px;line-height:1;padding:0;color:var(--muted)}
.inline-add{display:grid;grid-template-columns:1fr auto;gap:8px}
input[type=text],input[type=datetime-local],textarea{font:400 16px var(--display);border:1px solid var(--line);padding:12px 14px;background:rgba(255,255,255,.06);width:100%;border-radius:var(--r-md);-webkit-appearance:none;appearance:none;color:var(--text);min-width:0;transition:border-color .2s,box-shadow .2s}
input::placeholder,textarea::placeholder{color:var(--faint)}
input:focus,textarea:focus{outline:none;border-color:color-mix(in srgb,var(--star) 60%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--star) 15%,transparent)}
textarea{resize:vertical;min-height:84px}
.trace{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.trace li{display:grid;grid-template-columns:12px 1fr auto;gap:12px;align-items:baseline;padding:6px 0;position:relative}
.trace li::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--faint);align-self:center;justify-self:center}
.trace li.e-done::before{background:var(--ok);box-shadow:0 0 10px var(--ok)} .trace li.e-started::before{background:var(--sky);box-shadow:0 0 10px var(--sky)} .trace li.e-paused::before{background:var(--warn)} .trace li.e-reopened::before{background:var(--hot)} .trace li.e-sub::before{background:var(--violet)} .trace li.e-edited::before{background:var(--star)}
.trace li:not(:last-child)::after{content:"";position:absolute;left:5.5px;top:22px;bottom:-8px;width:1px;background:var(--line-2)}
.trace .w{font-size:14px;overflow-wrap:anywhere;min-width:0}
.trace time{font:400 11px/1 var(--mono);color:var(--faint);white-space:nowrap}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.confirm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:rgba(255,122,107,.12);border:1px solid rgba(255,122,107,.4);border-radius:var(--r-md);padding:12px}
.confirm p{margin:0;flex:1 1 100%}
.hint{font-size:13px;color:var(--faint);margin:0;line-height:1.45}

.done-list{display:flex;flex-direction:column;gap:6px}
.done-item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border-radius:var(--r-md);background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06);padding:10px 12px}
.done-item .x{width:20px;height:20px;border-radius:50%;background:var(--ok);display:grid;place-items:center;box-shadow:0 0 10px rgba(124,240,181,.5)}
.done-item .x svg{width:12px;height:12px;stroke:var(--ink);stroke-width:4;fill:none;stroke-linecap:round}
.done-item s{color:var(--muted);overflow-wrap:anywhere;min-width:0}
.done-item span{font:400 12px/1 var(--mono);color:var(--faint);white-space:nowrap}
.later{border:1px dashed var(--line-2);border-radius:var(--r-md);padding:10px 14px;display:flex;justify-content:space-between;gap:10px;font-size:14px;background:transparent;color:var(--muted);text-align:left}
.later b{font-weight:500}
.later span{font:400 12px/1.3 var(--mono);white-space:nowrap}

.empty{padding:24px 20px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.empty h3{margin:0;font-size:21px;font-weight:600;line-height:1.2;text-wrap:balance}
.empty p{margin:0;color:var(--muted)}

/* observatory */
#stage{margin-bottom:14px}
.scope{position:relative;aspect-ratio:1/1.05;max-width:100%;overflow:hidden;border-radius:28px;background:radial-gradient(circle at 50% 48%,rgba(255,255,255,.04),rgba(255,255,255,.01) 70%)}
.scope canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.scope .tape{position:absolute;top:14px;left:14px;z-index:2;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:99px;padding:6px 12px 6px 10px;font:500 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.08em;display:flex;gap:7px;align-items:center;color:var(--muted)}
.scope .tape::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--hot);box-shadow:0 0 8px var(--hot);animation:rec 1.6s ease-in-out infinite}
@keyframes rec{50%{opacity:.3}}
.scope .readout{position:absolute;left:18px;bottom:16px;z-index:2;color:var(--muted);font:400 12px/1.5 var(--mono)}
.scope .readout b{display:block;font:600 30px/1.1 var(--display);letter-spacing:-.02em;color:var(--star);text-shadow:0 0 24px color-mix(in srgb,var(--star) 60%,transparent)}
.stamp-on{position:absolute;inset:0;z-index:3;display:grid;place-items:center;pointer-events:none}
.stamp-on div{background:rgba(10,11,24,.45);border:1px solid var(--line-2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:999px;padding:14px 26px;font-weight:600;font-size:30px;letter-spacing:-.02em;color:#FFD0E8;text-shadow:0 0 24px #ff6bd5;animation:popIn .7s cubic-bezier(.3,1.5,.5,1) both}
.stamp-on div.reborn{color:#D6F0FF;text-shadow:0 0 24px #7cc8ff}
@keyframes popIn{from{transform:scale(.6);opacity:0;filter:blur(10px)}}
.ladder{display:flex;flex-direction:column;overflow:hidden;padding:6px}
.rung{display:grid;grid-template-columns:20px 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:var(--r-md);transition:background .3s}
.rung i{width:20px;height:20px;border-radius:50%;background:var(--g);box-shadow:0 0 12px rgba(255,255,255,.18)}
.rung b{font-weight:600;font-size:15px}
.rung p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.rung span{font:400 11px/1 var(--mono);color:var(--faint);white-space:nowrap}
.rung.now{background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--star) 45%,transparent)}
.rung.now b{color:var(--star)}
.rung.now span{color:var(--ink);background:var(--star);padding:5px 8px;border-radius:99px;font-weight:600}
.planets{display:flex;flex-direction:column;gap:10px}
.planet{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.planet i{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.85),transparent 50%),var(--c);box-shadow:0 0 12px var(--c)}
.planet span{font:400 12px/1 var(--mono);color:var(--muted)}

/* stats */
.big{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.big div{padding:14px 12px;min-width:0;border-radius:var(--r-md)}
.big b{display:block;font:500 26px/1 var(--mono);font-variant-numeric:tabular-nums;margin-bottom:6px}
.big div:nth-child(1) b{color:var(--ok);text-shadow:0 0 18px rgba(124,240,181,.5)}
.big div:nth-child(2) b{color:var(--star);text-shadow:0 0 18px color-mix(in srgb,var(--star) 50%,transparent)}
.big div:nth-child(3) b{color:var(--sky);text-shadow:0 0 18px rgba(124,200,255,.5)}
.big small{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.panel{padding:16px;display:flex;flex-direction:column;gap:12px}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;align-items:end;height:150px}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.bar i{width:100%;max-width:28px;border-radius:99px;background:linear-gradient(180deg,var(--sky),var(--violet));min-height:4px;transform-origin:bottom;animation:grow .7s cubic-bezier(.3,1.4,.5,1) both;box-shadow:0 0 14px rgba(124,200,255,.35)}
.bar.today i{background:linear-gradient(180deg,var(--ok),var(--sky));box-shadow:0 0 16px rgba(124,240,181,.5)}
.bar b{font:500 11px/1 var(--mono)} .bar span{font:400 11px/1 var(--mono);color:var(--faint);text-transform:uppercase}
@keyframes grow{from{transform:scaleY(0)}}
.cat-prog{display:flex;flex-direction:column;gap:12px}
.cp-head{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
.cp-head span{font:400 12px/1.4 var(--mono);color:var(--muted)}
.track{height:8px;border-radius:99px;background:rgba(255,255,255,.08);position:relative;overflow:hidden}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:40;background:rgba(2,3,10,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .25s;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}

<script>
(() => {
/* ================= constants ================= */
const PALETTE = ['#7CC8FF','#FF8FC8','#8EF0B8','#FFD27A','#C3A6FF','#FF9F7A'];
const SUGGEST = [['Trabajo','#7CC8FF'],['Casa','#FFD27A'],['Trámites','#FF9F7A'],['Salud','#8EF0B8'],['Dinero','#C3A6FF'],['Personas','#FF8FC8']];
const SIZES = ['','Chica','Mediana','Grande','Enorme','Monstruo'];
const SIZE_HINT = ['','Algo rápido que igual da vueltas en tu cabeza','Te toma un rato, molesta un poco','Te pesa de verdad','Te agobia solo pensarlo','Te quita el sueño'];
const REPEATS = [['none','No'],['daily','Diaria'],['weekly','Semanal'],['monthly','Mensual']];
const CAPS = [[15,'Chica'],[20,'Normal'],[30,'Grande']];
const STATES = [
  {max:.2,  name:'Radiante', c:'#9CC2FF',  hint:'Brilla fuerte. Vas muy ligero.',               g:'radial-gradient(circle at 35% 35%,#fff,#bcd4ff 50%,#6f95ff)'},
  {max:.5,  name:'Tranquila', c:'#FFD58A', hint:'Estable. Sigue soltando a tu ritmo.',          g:'radial-gradient(circle at 35% 35%,#fff,#ffe9a8 50%,#ffb020)'},
  {max:.75, name:'Inquieta', c:'#FFA45C',  hint:'Empieza a pulsar. Suelta algo chico hoy.',     g:'radial-gradient(circle at 35% 35%,#fff3d0,#ffa04a 50%,#e2560e)'},
  {max:1,   name:'Al límite', c:'#FF6B5A', hint:'Está temblando. Si sigue creciendo, explota.', g:'radial-gradient(circle at 35% 35%,#ffd0b8,#f2501f 50%,#a3160a)'},
  {max:1e9, name:'Supernova', c:'#D7A8FF', hint:'Explotó. De la nebulosa nace una nueva.',      g:'radial-gradient(circle at 35% 35%,#fff,#ff6bd5 35%,#6b5cff 70%,#22d3ee)'}
];
const REBIRTH_NEED = 3;
const LINES = {
  1:['Una menos.','Rápido y fuera.','Así se empieza.'],
  2:['Eso ya no da vueltas en tu cabeza.','Bien. Siguiente.','Tu estrella respira mejor.'],
  3:['Eso pesaba. Ya no.','Mira cómo avanzas.','Tu estrella se calmó un poco.'],
  4:['Eso te agobiaba y lo resolviste.','Respira. Ya está hecho.','Tu estrella lo nota.'],
  5:['Lo que te quitaba el sueño: HECHO.','Hoy duermes mejor.','Lo más difícil, y lo hiciste.']
};
const EV = { created:'Creada', started:'Empezaste', paused:'Pausaste', done:'Completada', reopened:'Reabierta', edited:'Editada', sub:'Paso hecho' };
const LS = 'miestrella.v1', LS_PREF = 'miestrella.prefs';
const EMBED = (() => { try { return window.self !== window.top; } catch(e) { return true; } })();
const STAR_ID = 'star-state';
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= state ================= */
let S = { tasks:{}, cats:{}, star:null };
let ui = { view:'tasks', filter:'all', open:null, confirmCat:null, sheetCat:null, newColor:PALETTE[3], sound:true, showLater:false };
let draft = null, col = null, readOnly = false, ready = false;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now = () => Date.now();
const newId = p => p + '-' + now().toString(36) + Math.random().toString(36).slice(2,7);
const clone = o => JSON.parse(JSON.stringify(o));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const dayKey = t => { const d = new Date(t); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); };
const startOfDay = t => { const d = new Date(t); d.setHours(0,0,0,0); return d.getTime(); };
const fmtWhen = t => new Date(t).toLocaleString('es', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'});
const fmtDay = t => { const k = dayKey(t); if (k === dayKey(now())) return 'Hoy'; if (k === dayKey(now()-864e5)) return 'Ayer'; return new Date(t).toLocaleDateString('es', {weekday:'long', day:'numeric', month:'short'}); };
function dur(ms){
  ms = Math.max(0, ms|0); const s = Math.floor(ms/1000);
  if (s < 60) return s + ' s';
  const m = Math.floor(s/60); if (m < 60) return m + ' min';
  const h = Math.floor(m/60); if (h < 24) return h + ' h' + (m%60 ? ' ' + (m%60) + ' min' : '');
  const d = Math.floor(h/24); return d + ' d' + (h%24 ? ' ' + (h%24) + ' h' : '');
}
function clock(ms){ const s = Math.floor(ms/1000), h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return (h ? h + ':' + String(m).padStart(2,'0') : m) + ':' + String(x).padStart(2,'0'); }
const focusMs = t => (t.activeMs||0) + (t.runningSince ? now() - t.runningSince : 0);
const takenMs = t => { const f = t.activeMs||0; return f > 0 ? f : (t.completedAt||now()) - t.createdAt; };
const catOf = t => S.cats[t.catId];
const colorOf = t => catOf(t)?.color || '#FFFFFF';
const visible = t => !t.completedAt && !(t.showFrom && t.showFrom > now());
const star = () => S.star || { kind:'star', phase:'star', armed:true, progress:0, rebirths:0, supernovas:0, cap:20 };

/* ================= load model ================= */
function taskLoad(t){
  if (!visible(t)) return 0;
  let l = t.size || 1;
  const subs = t.subs || [];
  if (subs.length) l *= 1 - .6 * subs.filter(s => s.done).length / subs.length;
  if (t.due && t.due < now()) l *= 2;
  return l;
}
const loadOf = () => Object.values(S.tasks).reduce((a,t) => a + taskLoad(t), 0) / (star().cap || 20);
const stateOf = L => star().phase === 'nebula' ? STATES[4] : STATES.find(s => L <= s.max) || STATES[3];

/* ================= storage ================= */
function loadLocal(){
  try { const r = JSON.parse(localStorage.getItem(LS) || 'null'); if (r) { S.tasks = r.tasks||{}; S.cats = r.cats||{}; S.star = r.star||null; } } catch(e){}
  try { const p = JSON.parse(localStorage.getItem(LS_PREF) || 'null'); if (p) { ui.sound = p.sound !== false; ui.sheetCat = p.lastCat || null; } } catch(e){}
}
function saveLocal(){ try { localStorage.setItem(LS, JSON.stringify(S)); } catch(e){} }
function savePrefs(){ try { localStorage.setItem(LS_PREF, JSON.stringify({sound:ui.sound, lastCat:ui.sheetCat})); } catch(e){} }
const queues = {};
function enqueue(id, fn){ queues[id] = (queues[id] || Promise.resolve()).then(fn).catch(onDbErr); }
function onDbErr(e){
  const c = e && e.code;
  if (c === 'quota_exceeded') toast('Se llenó el espacio. Borra tareas viejas para seguir guardando.');
  else if (c === 'invalid_argument' || c === 'not_granted') { readOnly = true; setSync('Sin permiso para guardar en la nube. Se guarda en este dispositivo.'); }
  else if (c === 'unavailable') toast('Sin conexión. Reintenta en un momento.');
}
function put(kind, id, doc, quiet){
  if (kind === 'task') S.tasks[id] = doc; else if (kind === 'cat') S.cats[id] = doc; else S.star = doc;
  saveLocal(); if (!quiet) render();
  if (col && !readOnly) enqueue(id, () => col.doc(id).set(doc));
}
function remove(kind, id){
  delete (kind === 'task' ? S.tasks : S.cats)[id]; saveLocal(); render();
  if (col && !readOnly) enqueue(id, () => col.doc(id).delete());
}
function setSync(t){ $('#sync').textContent = t; }

async function connect(){
  for (let i = 0; i < 15 && !(window.claude && window.claude.use); i++) await new Promise(r => setTimeout(r, 200));
  if (!(window.claude && window.claude.use)) { setSync('Guardado en este dispositivo'); ready = true; checkStar(); return; }
  setSync('Conectando…');
  let db, user;
  try { [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); } catch(e){}
  let uid = null; if (user) { try { uid = await user.id(); } catch(e){} }
  if (!db || !uid) { setSync('Guardado en este dispositivo'); ready = true; checkStar(); return; }
  col = db.collection('data/users/' + uid);
  let confirmed = false;
  const timer = setTimeout(() => { if (!confirmed) { setSync('No se alcanza la nube todavía. Tus cambios se guardan aquí.'); ready = true; checkStar(); } }, 10000);
  col.onSnapshot(snap => {
    const tasks = {}, cats = {}; let st = null;
    snap.docs.forEach(d => { const v = d.data(); if (!v) return; if (v.kind === 'task') tasks[d.id] = v; else if (v.kind === 'cat') cats[d.id] = v; else if (v.kind === 'star') st = v; });
    if (!snap.metadata.fromCache && !confirmed) {
      confirmed = true; clearTimeout(timer); setSync('Sincronizado');
      const localHas = Object.keys(S.tasks).length + Object.keys(S.cats).length;
      if (snap.empty && localHas) {
        Object.entries(S.cats).forEach(([id, d]) => enqueue(id, () => col.doc(id).set(d)));
        Object.entries(S.tasks).forEach(([id, d]) => enqueue(id, () => col.doc(id).set(d)));
        if (S.star) enqueue(STAR_ID, () => col.doc(STAR_ID).set(S.star));
        ready = true; checkStar(); return;
      }
      S = { tasks, cats, star: st }; saveLocal();
      if (st && st.phase === 'nebula' && A.mode === 'star') A.mode = 'nebula';
      ready = true; render(); checkStar(); return;
    }
    if (snap.empty && !confirmed) return;
    S = { tasks, cats, star: st }; saveLocal(); render();
  }, () => { clearTimeout(timer); ready = true; setSync('Se perdió la conexión. Recarga para volver a sincronizar.'); });
}

/* ================= star lifecycle ================= */
function checkStar(){
  if (!ready) return;
  const st = star(), L = loadOf();
  if (st.phase === 'star' && L > 1 && st.armed !== false) {
    put('star', STAR_ID, {...st, kind:'star', phase:'nebula', progress:0, supernovas:(st.supernovas||0)+1, armed:false, explodedAt:now()}, true);
    triggerSupernova();
    render();
  } else if (st.phase === 'star' && st.armed === false && L <= 1) {
    put('star', STAR_ID, {...st, kind:'star', armed:true}, true);
  }
}
function onCompletedForStar(){
  const st = star();
  if (st.phase !== 'nebula') return false;
  const p = (st.progress||0) + 1;
  if (p >= REBIRTH_NEED) {
    A.rebirthT0 = 1;
    put('star', STAR_ID, {...st, kind:'star', phase:'star', progress:0, rebirths:(st.rebirths||0)+1, armed: loadOf() <= 1}, true);

    const subs = t.subs || [];
    hist += `<div class="hist-item" style="--c:${colorOf(t)}"><b>${esc(t.title)}</b><span>${dur(takenMs(t))}</span>
      <small>${esc(catOf(t)?.name || 'Sin tipo')} · ${SIZES[t.size||1]}${subs.length ? ' · ' + subs.length + ' pasos' : ''} · anotada ${fmtWhen(t.createdAt)} · hecha ${fmtWhen(t.completedAt)}${t.due ? (t.completedAt <= t.due ? ' · a tiempo' : ' · después del límite') : ''}</small></div>`;
  });
  return `<section class="view">
    <h2>Tu progreso</h2>
    <div class="big"><div><b>${done.length}</b><small>tareas hechas</small></div><div><b>${freed}%</b><small>carga soltada</small></div><div><b>${st}</b><small>${st===1?'día':'días'} de racha</small></div></div>
    <div class="panel"><div class="lbl">Tareas por día · últimos 7</div><div class="bars">${bars}</div></div>
    <div class="panel"><div class="lbl">Tiempos</div><div class="quick">
      <div><small>Promedio</small><b>${dur(avg)}</b></div>
      <div><small>Más rápida</small><b>${dur(takenMs(fastest))}</b></div>
      <div style="grid-column:1/-1"><small>Lo más grande que soltaste</small><b>${esc(biggest.title)} · ${SIZES[biggest.size||1]}</b></div>
    </div></div>
    ${catBars ? `<div class="panel"><div class="lbl">Avance por tipo</div><div class="cat-prog">${catBars}</div></div>` : ''}
    <div class="lbl">Historial</div><div class="hist">${hist}</div>
  </section>`;
}
function viewTypes(){
  const cats = Object.entries(S.cats).sort((a,b) => a[1].createdAt - b[1].createdAt);
  const names = new Set(cats.map(([,c]) => c.name.toLowerCase()));
  const sugg = SUGGEST.filter(([n]) => !names.has(n.toLowerCase()));
  const rows = cats.map(([id,c]) => {
    const ts = Object.values(S.tasks).filter(t => t.catId === id), p = ts.filter(t => visible(t)).length;
    if (ui.confirmCat === id) return `<div class="confirm"><p>¿Borrar el tipo “${esc(c.name)}”? Sus ${ts.length} tareas quedan como “Sin tipo”.</p><button class="btn small danger" data-act="cat-del-yes" data-id="${id}">Sí, borrar</button><button class="btn small ghost" data-act="cat-del-no">Cancelar</button></div>`;
    return `<div class="cat-row" style="--c:${c.color}"><span class="sw"></span><div style="min-width:0"><b>${esc(c.name)}</b><small>${p} pendientes · ${ts.filter(t => t.completedAt).length} hechas</small></div><button class="x-btn" data-act="cat-del" data-id="${id}" aria-label="Borrar tipo ${esc(c.name)}">×</button></div>`;
  }).join('');
  const cap = star().cap || 20;
  return `<section class="view">
    <h2>Tipos de tareas</h2>
    <div class="panel">
      <div class="field"><label class="lbl" for="catName">Nuevo tipo</label><input type="text" id="catName" placeholder="Ej. Universidad" maxlength="24" enterkeyhint="done" autocomplete="off"></div>
      <div class="swatches">${PALETTE.map(c => `<button class="swatch ${ui.newColor===c?'on':''}" style="--c:${c}" data-act="color" data-c="${c}" aria-label="Color ${c}"></button>`).join('')}</div>
      <button class="btn primary" data-act="add-cat">Crear tipo</button>
      ${sugg.length ? `<div class="lbl">Ideas rápidas</div><div class="chips wrap">${sugg.map(([n,c]) => `<button class="chip" style="--c:${c}" data-act="sugg" data-n="${esc(n)}" data-c="${c}"><span class="dot"></span>${esc(n)}</button>`).join('')}</div>` : ''}
    </div>
    ${rows || `<div class="empty"><h3>Aún no tienes tipos.</h3><p>Cada tipo es un planeta que gira alrededor de tu estrella. Así ves qué área de tu vida te está cargando más.</p></div>`}
    <h2>Ajustes</h2>
    <div class="panel">
      <div class="lbl">Aguante de tu estrella</div>
      <div class="pick" style="grid-template-columns:repeat(3,1fr)">${CAPS.map(([v,n]) => `<button class="${cap===v?'on':''}" data-act="cap" data-v="${v}"><b>${n}</b><small>${v} de carga</small></button>`).join('')}</div>
      <p class="hint">Cuánta carga aguanta antes de explotar. Una tarea Grande pesa 3, una Monstruo pesa 5.</p>
      <div class="toggle-row">Sonido al completar <button class="switch" role="switch" aria-checked="${ui.sound}" data-act="sound" aria-label="Sonido"></button></div>
    </div>
  </section>`;
}

/* ================= sheet (create / edit) ================= */
function toLocalInput(t){ const d = new Date(t); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,16); }
function defaultDue(){ const d = new Date(); d.setDate(d.getDate()+1); d.setHours(10,0,0,0); return d.getTime(); }
function openSheet(editId){
  if (ui.filter !== 'all' && S.cats[ui.filter]) ui.sheetCat = ui.filter;
  if (ui.sheetCat && !S.cats[ui.sheetCat]) ui.sheetCat = null;
  const t = editId ? S.tasks[editId] : null;
  draft = t ? { id:editId, title:t.title, catId:t.catId||null, size:t.size||1, hasDue:!!t.due, due:t.due||defaultDue(), repeat:t.repeat||'none', notes:t.notes||'', remind:!!t.remind }
            : { id:null, title:'', catId:ui.sheetCat, size:2, hasDue:false, due:defaultDue(), repeat:'none', notes:'', remind:true };
  drawSheet(true);
}
function drawSheet(first){
  const cats = Object.entries(S.cats).sort((a,b) => a[1].createdAt - b[1].createdAt), d = draft;
  const titleVal = first ? d.title : ($('#taskTitle')?.value ?? d.title);
  const sh = $('#sheet');
  sh.innerHTML = `<form class="sheet" id="sheetForm" role="dialog" aria-label="${d.id ? 'Editar tarea' : 'Nueva tarea'}" autocomplete="off">
    <div class="grab" aria-hidden="true"></div>
    <div class="sheet-head"><h2>${d.id ? 'Editar' : '¿Qué te pesa?'}</h2><button type="button" class="x-btn" data-act="close-sheet" aria-label="Cerrar">×</button></div>
    <input type="text" id="taskTitle" placeholder="Ej. Pagar la tarjeta" maxlength="120" enterkeyhint="done" value="${esc(titleVal)}">
    <div class="lbl">Tipo</div>
    <div class="chips">
      <button type="button" class="chip ${!d.catId?'on':''}" data-act="d-cat" data-id="">Sin tipo</button>
      ${cats.map(([id,c]) => `<button type="button" class="chip ${d.catId===id?'on':''}" style="--c:${c.color}" data-act="d-cat" data-id="${id}"><span class="dot"></span>${esc(c.name)}</button>`).join('')}
      ${cats.length ? '' : `<button type="button" class="chip" data-act="go-types">+ Crear tipos</button>`}
    </div>
    <div class="lbl">Tamaño · cuánto te estresa</div>
    <div class="pick">${[1,2,3,4,5].map(w => `<button type="button" class="${d.size===w?'on':''}" data-act="d-size" data-w="${w}"><b>${w}</b><small>${SIZES[w]}</small></button>`).join('')}</div>
    <div class="ssub">${SIZE_HINT[d.size]} · +${Math.round(d.size/(star().cap||20)*100)}% de carga</div>
    <div class="opt">
      <div class="opt-head">Fecha límite <button type="button" class="switch" role="switch" aria-checked="${d.hasDue}" data-act="d-due" aria-label="Fecha límite"></button></div>
      ${d.hasDue ? `<input type="datetime-local" id="dueIn" value="${toLocalInput(d.due)}">
        <div class="opt-head" style="font-weight:700">Recordarme en el Calendario <button type="button" class="switch" role="switch" aria-checked="${d.remind}" data-act="d-remind" aria-label="Recordatorio en calendario"></button></div>
        <p class="hint">${EMBED ? 'Al guardar te doy un botón para agregarla a Google Calendar (si lo tienes en tu iPhone, te avisa ahí).' : 'Al guardar se abre el evento para tu Calendario de iPhone con avisos 1 día, 3 h, 1 h y 30 min antes.'} Si se vence, pesa el doble.</p>` : ''}
    </div>
    <div class="opt">
      <div class="opt-head">Repetir</div>
      <div class="pick four">${REPEATS.map(([k,n]) => `<button type="button" class="${d.repeat===k?'on':''}" data-act="d-rep" data-r="${k}"><small>${n}</small></button>`).join('')}</div>
    </div>
    <div class="field"><label class="lbl" for="notesIn">Notas (opcional)</label><textarea id="notesIn" placeholder="Números, links, detalles">${esc(first ? d.notes : ($('#notesIn')?.value ?? d.notes))}</textarea></div>
    <button class="btn primary" type="submit">${d.id ? 'Guardar cambios' : 'Agregar'}</button>
  </form>`;
  sh.hidden = false;
  if (first) $('#taskTitle').focus();
}
function syncDraftInputs(){
  if (!draft) return;
  const ti = $('#taskTitle'), no = $('#notesIn'), du = $('#dueIn');
  if (ti) draft.title = ti.value; if (no) draft.notes = no.value;
  if (du && du.value) { const v = new Date(du.value).getTime(); if (!isNaN(v)) draft.due = v; }
}
function closeSheet(){ $('#sheet').hidden = true; $('#sheet').innerHTML = ''; draft = null; }
function saveDraft(){
  syncDraftInputs();
  const d = draft, title = d.title.trim();
  if (!title) { $('#taskTitle').focus(); toast('Escribe qué tienes que hacer.'); return; }
  const n = now();
  let id = d.id;
  if (id) {
    edit(id, t => { t.title = title; t.catId = d.catId; t.size = d.size; t.due = d.hasDue ? d.due : null; t.repeat = d.repeat; t.notes = d.notes; t.remind = d.hasDue && d.remind; t.log.push({t:n, e:'edited'}); });
    toast('Cambios guardados.');
  } else {
    id = newId('t');
    put('task', id, { kind:'task', title, catId:d.catId||null, size:d.size, due:d.hasDue ? d.due : null, repeat:d.repeat, notes:d.notes, remind:d.hasDue && d.remind,
      subs:[], createdAt:n, activeMs:0, runningSince:null, completedAt:null, showFrom:null, log:[{t:n, e:'created'}] });
    ui.sheetCat = d.catId; savePrefs();
    if (!(d.hasDue && d.remind)) toast(`Anotada. +${Math.round(d.size/(star().cap||20)*100)}% de carga en tu estrella.`);
  }
  const wantCal = d.hasDue && d.remind;
  closeSheet();
  if (wantCal) {
    if (EMBED) { ui.view = 'tasks'; ui.open = id; render(); toast('Toca “Agregar a Google Calendar” para el recordatorio.'); }
    else downloadICS(id);
  }
  checkStar();
}

/* ================= swipe ================= */
let sw = null, suppressClick = false;
document.addEventListener('pointerdown', e => {
  const row = e.target.closest('[data-swipe]'); if (!row || e.pointerType === 'mouse' && e.button !== 0) return;
  sw = { row, id: row.dataset.swipe, x0: e.clientX, y0: e.clientY, dx: 0, active: false };
});
document.addEventListener('pointermove', e => {
  if (!sw) return;
  const dx = e.clientX - sw.x0, dy = e.clientY - sw.y0;
  if (!sw.active) { if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy)*1.3) { sw.active = true; sw.row.classList.remove('snap'); } else if (Math.abs(dy) > 12) { sw = null; return; } else return; }
  sw.dx = dx; sw.row.style.transform = `translateX(${dx}px) rotate(${dx/60}deg)`;
  const card = sw.row.parentElement; card.classList.toggle('sw-r', dx > 0); card.classList.toggle('sw-l', dx < 0);
});
function endSwipe(){
  if (!sw) return;
  const { row, id, dx, active } = sw; sw = null;
  if (!active) return;
  suppressClick = true; setTimeout(() => suppressClick = false, 60);
  const W = row.offsetWidth;
  if (dx > Math.min(110, W*.3)) { row.classList.add('snap'); row.style.transform = `translateX(${W*1.2}px) rotate(10deg)`; setTimeout(() => completeT(id, true), 220); }
  else if (dx < -Math.min(110, W*.3)) { row.classList.add('snap'); row.style.transform = `translateX(${-W*1.2}px) rotate(-10deg)`; setTimeout(() => deleteT(id), 220); }
  else { row.classList.add('snap'); row.style.transform = ''; }
}
document.addEventListener('pointerup', endSwipe);
document.addEventListener('pointercancel', endSwipe);

/* ================= events ================= */
document.addEventListener('click', e => {
  if (suppressClick) { e.preventDefault(); e.stopPropagation(); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  switch (a) {
    case 'view': ui.view = el.dataset.v; ui.open = null; ui.confirmCat = null; render(); window.scrollTo({top:0}); break;
    case 'filter': ui.filter = el.dataset.f; render(); break;
    case 'toggle': ui.open = ui.open === id ? null : id; render(); break;
    case 'complete': completeT(id); break;
    case 'start': startT(id); break;
    case 'pause': pauseT(id); break;
    case 'reopen': reopenT(id); break;
    case 'del': deleteT(id); break;
    case 'edit': openSheet(id); break;
    case 'ics': downloadICS(id); break;
    case 'later': ui.showLater = !ui.showLater; render(); break;
    case 'sub': edit(id, t => { const s = t.subs.find(x => x.id === el.dataset.s); if (s) { s.done = !s.done; if (s.done) t.log.push({t: now(), e:'sub', x: s.text}); } }); A.pulses.push(performance.now()); break;
    case 'sub-del': edit(id, t => { t.subs = t.subs.filter(x => x.id !== el.dataset.s); }); break;
    case 'open-sheet': openSheet(); break;
    case 'close-sheet': closeSheet(); break;
    case 'close-celebrate': $('#celebrate').hidden = true; break;
    case 'toast-action': if (toastFn) toastFn(); toastFn = null; $('#toast').hidden = true; break;
    case 'd-cat': syncDraftInputs(); draft.catId = id || null; drawSheet(); break;
    case 'd-size': syncDraftInputs(); draft.size = +el.dataset.w; drawSheet(); break;
    case 'd-due': syncDraftInputs(); draft.hasDue = !draft.hasDue; drawSheet(); break;
    case 'd-remind': syncDraftInputs(); draft.remind = !draft.remind; drawSheet(); break;
    case 'd-rep': syncDraftInputs(); draft.repeat = el.dataset.r; drawSheet(); break;
    case 'go-types': closeSheet(); ui.view = 'types'; render(); break;
    case 'color': ui.newColor = el.dataset.c; document.querySelectorAll('.swatch').forEach(s => s.classList.toggle('on', s === el)); break;
    case 'add-cat': { const inp = $('#catName'), n = inp.value.trim(); if (!n) { inp.focus(); toast('Escribe un nombre para el tipo.'); break; } addCat(n, ui.newColor); break; }
    case 'sugg': addCat(el.dataset.n, el.dataset.c); break;
    case 'cat-del': ui.confirmCat = id; render(); break;
    case 'cat-del-no': ui.confirmCat = null; render(); break;
    case 'cat-del-yes': ui.confirmCat = null; if (ui.filter === id) ui.filter = 'all'; remove('cat', id); toast('Tipo borrado.'); break;
    case 'cap': { const st = star(); put('star', STAR_ID, {...st, kind:'star', cap: +el.dataset.v}); checkStar(); break; }
    case 'sound': ui.sound = !ui.sound; savePrefs(); render(); if (ui.sound) sfx(); break;
  }
}, true);
function addCat(name, color){
  if (Object.values(S.cats).some(c => c.name.toLowerCase() === name.toLowerCase())) { toast('Ese tipo ya existe.'); return; }
  const used = new Set([...Object.values(S.cats).map(c => c.color), color]);
  put('cat', newId('c'), { kind:'cat', name, color, createdAt: now() }, true);
  ui.newColor = PALETTE.find(c => !used.has(c)) || PALETTE[0];
  render(); toast('Tipo “' + name + '” creado. Ya gira alrededor de tu estrella.');
}
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'sheetForm') { saveDraft(); return; }
  if (e.target.dataset.form === 'sub') {
    const id = e.target.dataset.id, inp = e.target.querySelector('input'), v = inp.value.trim(); if (!v) return;
    ui.refocus = 'subIn-' + id;
    edit(id, t => { t.subs = t.subs || []; t.subs.push({id: newId('s'), text: v, done: false}); });
  }
});
document.addEventListener('focusout', e => {
  const id = e.target.dataset && e.target.dataset.notes; if (!id || !S.tasks[id]) return;
  const v = e.target.value; if (v === (S.tasks[id].notes||'')) return;
  const t = clone(S.tasks[id]); t.notes = v; put('task', id, t, true);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'catName') { e.preventDefault(); document.querySelector('[data-act="add-cat"]').click(); }
  if (e.key === 'Escape') { closeSheet(); $('#celebrate').hidden = true; }
});
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });

setInterval(() => {
  document.querySelectorAll('[data-timer]').forEach(el => { const t = S.tasks[el.dataset.timer]; if (t && t.runningSince) el.textContent = clock(focusMs(t)); });
}, 1000);
let lastMin = Math.floor(now()/6e4);
setInterval(() => {
  const m = Math.floor(now()/6e4); if (m === lastMin) return; lastMin = m;
  const active = document.activeElement;
  if (!(active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA'))) render(); else renderHeader();
  checkStar();
}, 15000);

loadLocal();
if (star().phase === 'nebula') A.mode = 'nebula';
A.sL = clamp(loadOf(), 0, 1.15);
render();
requestAnimationFrame(frame);
connect();
})();
</script>
